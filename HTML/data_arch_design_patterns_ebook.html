        function goToPage(index) {
            currentPage = index;
            renderPage();
            renderMenu();
            toggleMenu();
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                renderPage();
                renderMenu();
            }
        }

        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
                renderMenu();
            }
        }

        renderPage();
        renderMenu();
    </script>
</body>
</html>
