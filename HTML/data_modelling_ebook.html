                    </div>
                    
                    <div style="margin-top: 32px;">
                        <h3 style="color: #3b82f6;">The Blueprint of Data Systems</h3>
                        <p>Just as architects create blueprints before constructing buildings, data professionals create models before implementing databases. These models communicate how data elements relate to each other, ensuring everyone—from developers to business analysts—shares the same understanding of the data landscape.</p>

                            <li><strong>Relationships</strong> - Shows how different data elements connect</li>

                    <h2>Core Principles of Data Modelling</h2>
                    <p style="color: #6b7280; margin-bottom: 24px;">Six fundamental principles that guide effective data model design.</p>
                    
                    <div class="step-box" style="background-color: #eff6ff;">
                        <div class="step-number" style="background-color: #3b82f6;">1</div>
                        <div>
                            <h3 style="color: #1e40af;">Entity-Relationship (ER)</h3>
                            <p>Define entities (tables) and relationships (links) between them. Entities represent real-world objects like customers, orders, or products. Relationships show how these entities connect—one customer can have many orders.</p>
                        </div>
                    </div>

                    <div class="step-box" style="background-color: #eef2ff;">
                        <div class="step-number" style="background-color: #6366f1;">2</div>
                        <div>
                            <h3 style="color: #4f46e5;">Normalization</h3>
                            <p>Reduce redundancy by organizing data into logical groups. Break data into separate tables to eliminate duplication. For example, store customer addresses once rather than repeating them in every order record.</p>

                    </div>

                        <div>

        function renderPage() {
            const page = pages[currentPage];
            document.getElementById('pageIcon').textContent = page.icon;
            document.getElementById('pageNumber').textContent = `Chapter ${currentPage + 1} of ${pages.length}`;
            document.getElementById('pageTitle').textContent = page.title;
            document.getElementById('pageContent').innerHTML = page.content;
            document.getElementById('pageIndicator').textContent = `Page ${currentPage + 1} of ${pages.length}`;
            
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === pages.length - 1;
            
            completedPages.add(currentPage);
            const progress = ((completedPages.size) / pages.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = Math.round(progress) + '% Complete';
            
            window.scrollTo(0, 0);
        }

        function renderMenu() {
            const menuItems = pages.map((page, index) => `
                <button class="menu-item ${currentPage === index ? 'active' : ''}" onclick="goToPage(${index})">
                    <div class="menu-item-content">
                        <span class="menu-item-icon">${page.icon}</span>
                        <div style="flex: 1; text-align: left;">
                            <div class="menu-item-title">${page.title}</div>
                            <div class="menu-item-subtitle">Chapter ${index + 1}</div>
                        </div>
                        ${completedPages.has(index) ? '<span style="color: #10b981; font-size: 20px;">✓</span>' : ''}
                    </div>
                </button>
            `).join('');
            
            document.getElementById('menuItems').innerHTML = menuItems;
        }

        function toggleMenu() {
            const overlay = document.getElementById('menuOverlay');
            const sidebar = document.getElementById('menuSidebar');
            overlay.classList.toggle('active');
            sidebar.classList.toggle('active');
        }

        function goToPage(index) {
            currentPage = index;
            renderPage();
            renderMenu();
            toggleMenu();
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                renderPage();
                renderMenu();
            }
        }

        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
                renderMenu();
            }
        }

        renderPage();
        renderMenu();
    </script>
